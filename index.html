<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redmi | Power Meets Performance</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Internal CSS -->
    <style>
        :root {
            --redmi-red: #ff6900;
            --dark: #111111;
            --light-bg: #f7f7f7;
            --text-muted: #707070;
        }

        * {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: #fff;
            color: var(--dark);
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(15px);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.06);
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #111;
        }

        .brand-logo span {
            background: var(--redmi-red);
            color: #fff;
            padding: 4px 7px;
            border-radius: 6px;
            margin-right: 7px;
        }

        .nav-link {
            font-weight: 500;
            margin: 0 8px;
            color: #333 !important;
        }

        .nav-link:hover {
            color: var(--redmi-red) !important;
        }

        .btn-redmi {
            background: var(--redmi-red);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 25px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-redmi:hover {
            background: #e95700;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 105, 0, 0.25);
        }

        .btn-outline-dark {
            border-radius: 30px;
            padding: 11px 24px;
            font-weight: 600;
        }

        /* Hero */
        .hero {
            min-height: 680px;
            background:
                radial-gradient(circle at 75% 40%, rgba(255, 105, 0, 0.18), transparent 30%),
                linear-gradient(135deg, #fafafa, #eeeeee);
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .hero-content h1 {
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -4px;
        }

        .hero-content h1 span {
            color: var(--redmi-red);
        }

        .hero-content p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 550px;
            line-height: 1.7;
        }

        .hero-phone {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone {
            width: 280px;
            height: 560px;
            background: linear-gradient(145deg, #202020, #050505);
            border: 8px solid #292929;
            border-radius: 42px;
            box-shadow:
                30px 35px 60px rgba(0, 0, 0, 0.3),
                inset -5px -5px 15px rgba(255,255,255,0.05);
            position: relative;
            transform: rotate(8deg);
        }

        .phone-screen {
            position: absolute;
            inset: 7px;
            border-radius: 34px;
            overflow: hidden;
            background:
                radial-gradient(circle at 25% 25%, #ff9d50, transparent 25%),
                linear-gradient(145deg, #ff6900, #7d1f00 70%);
        }

        .phone-screen::before {
            content: "";
            position: absolute;
            width: 90px;
            height: 22px;
            background: #050505;
            border-radius: 20px;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
        }

        .screen-text {
            position: absolute;
            bottom: 40px;
            left: 25px;
            color: white;
        }

        .screen-text h3 {
            font-size: 2rem;
            font-weight: 800;
        }

        .camera {
            position: absolute;
            top: 25px;
            left: 22px;
            width: 80px;
            height: 105px;
            background: #151515;
            border-radius: 20px;
            z-index: 2;
            padding: 9px;
        }

        .lens {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: radial-gradient(circle, #777, #111 55%, #000);
            border: 3px solid #333;
            margin: 4px;
            display: inline-block;
        }

        /* Features */
        .feature-card {
            border: none;
            border-radius: 20px;
            padding: 30px;
            height: 100%;
            background: #fff;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
            transition: 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
        }

        .feature-icon {
            width: 58px;
            height: 58px;
            background: #fff0e8;
            color: var(--redmi-red);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .section-subtitle {
            color: var(--text-muted);
            max-width: 600px;
            margin: auto;
        }

        /* Products */
        .products-section {
            background: var(--light-bg);
        }

        .product-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #eee;
            height: 100%;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            height: 330px;
            background: linear-gradient(145deg, #f3f3f3, #e5e5e5);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .mini-phone {
            width: 125px;
            height: 245px;
            border-radius: 23px;
            background: linear-gradient(145deg, #292929, #050505);
            border: 5px solid #333;
            position: relative;
            box-shadow: 15px 20px 30px rgba(0,0,0,0.2);
        }

        .mini-phone.blue {
            background: linear-gradient(145deg, #4377ff, #101b50);
        }

        .mini-phone.gold {
            background: linear-gradient(145deg, #e8c08c, #4b301d);
        }

        .mini-phone::after {
            content: "";
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 7px;
            background: #111;
            border-radius: 10px;
        }

        .product
